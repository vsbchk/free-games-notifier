name: Offline tests
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: ruff check notifier tests start.py test_runner.py
      - run: python -m compileall -q notifier tests start.py test_runner.py
      - name: Validate Compose without real credentials
        run: docker compose config --quiet
        env:
          TELEGRAM_BOT_TOKEN: '123:offline'
          TELEGRAM_CHAT_ID: '-100123'
          DISCORD_WEBHOOK_URL: 'https://discord.com/api/webhooks/123/offline'
